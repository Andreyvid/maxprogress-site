<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Página não encontrada — MaxProgress</title>
<meta name="color-scheme" content="dark light">
<style>
:root{--bg:#17161B;--tx:#F0F0F2;--mu:#9B9AA6;--or:#F4632A}
@media (prefers-color-scheme:light){:root{--bg:#F5F4F0;--tx:#17161B;--mu:#5E5D69}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--tx);font:17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:24px}
b{display:block;font:800 clamp(88px,22vw,180px)/1 "Arial Narrow",Impact,sans-serif;color:var(--or);letter-spacing:.02em}
h1{margin:8px 0 6px;font-size:26px}
p{color:var(--mu);margin:0 0 24px}
a{display:inline-block;background:var(--or);color:#17161B;font-weight:600;padding:13px 26px;border-radius:99px;text-decoration:none}
a:focus-visible{outline:2px solid var(--tx);outline-offset:3px}
</style>
</head>
<body>
<main>
<b>404</b>
<h1>Esse treino não existe</h1>
<p>A página que você procura não foi encontrada ou mudou de lugar.</p>
<a href="/">Voltar ao início</a>
</main>
</body>
</html>
